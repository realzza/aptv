# Channel catalog for build.py.
#
# Each channel collects candidate URLs from `urls` (pinned) plus every upstream playlist entry
# whose normalized name matches the channel's name, tvg or aliases. `en` adds the English names
# iptv-org uses ("Zhejiang Satellite TV", "Zhejiang TV"). Every candidate is probed from wherever
# the build runs, and only streams that actually play are written to dist/.

[settings]
epg = "https://live.fanmingming.cn/e.xml"
logo_base = "https://live.fanmingming.cn/tv/"
probe_timeout = 12        # seconds per HTTP request
max_candidates = 40       # per channel, pinned URLs first
min_headroom = 1.3        # download speed / stream bitrate needed to count as smooth
uhd_height = 2000         # sources at least this tall are also listed under the 4K group
stale_days = 3            # keep last-known-good sources this long when a channel stops probing
group_order = ["4K 超高清", "央视", "卫视", "浙江", "CGTN"]
uhd_group = "4K 超高清"

# Hosts run by the broadcasters themselves (or their own CDNs). Anything else is a third-party relay.
official_hosts = [
  "cztv.com", "cztvcloud.com",          # 浙江广电 / 中国蓝
  "mgtv.com",                           # 湖南广电 / 芒果TV
  "bestv.cn",                           # 东方明珠 BesTV (SMG)
  "hebtv.com",                          # 河北广电
  "kan0512.com",                        # 苏州广电
  "nmtv.cn",                            # 内蒙古广电
  "xntv.tv",                            # 西宁 / 安多卫视
  "jstv.com",                           # 江苏广电
  "btime.com", "brtn.cn",               # 北京广电
  "sztv.com.cn",                        # 深圳广电
  "gdtv.cn",                            # 广东广电
  "iqilu.com",                          # 山东广电
  "cntv.cn", "cctv.com", "cctv.cn", "yangshipin.cn", "cctvplus.com",
  "cgtn.com", "*cgtn*",
]

[[upstreams]]
name = "iptv-org / China"
url = "https://iptv-org.github.io/iptv/countries/cn.m3u"

[[upstreams]]
name = "iptv-org / Chinese language"
url = "https://iptv-org.github.io/iptv/languages/zho.m3u"

[[upstreams]]
name = "Guovin/iptv-api"
url = "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u"

[[upstreams]]
name = "vbskycn/iptv"
url = "https://raw.githubusercontent.com/vbskycn/iptv/master/tv/iptv4.m3u"

