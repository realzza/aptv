name: test

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["dist/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Unit + local HLS tests
        run: python3 -m unittest discover -s tests -v
