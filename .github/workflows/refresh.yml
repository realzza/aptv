# Re-probe every candidate stream from a US runner and publish what plays.
name: refresh playlists

on:
  schedule:
    - cron: "23 2,14 * * *"   # ~7am and ~7pm US Pacific; 14:23 UTC is also China prime time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "channels.toml"]

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Build playlists
        run: python3 build.py && cat dist/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit when playlists change (and at least daily, to keep last-known-good state fresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          if git diff --cached --quiet -- 'dist/*.m3u'; then
            last=$(git log -1 --format=%ct -- dist/channels.json)
            if [ $(( $(date +%s) - ${last:-0} )) -lt 72000 ]; then echo "playlists unchanged"; exit 0; fi
          fi
          git commit -q -m "Refresh playlists ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull -q --rebase && git push -q
